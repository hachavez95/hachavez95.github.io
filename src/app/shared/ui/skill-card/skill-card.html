<article class="h-full space-y-2 border border-[#30363D] rounded-2xl bg-[#161B22] px-6 py-8">
    <div>
        <app-icon [name]="icon()" color="text-[#ADC6FF]" size="size-12" />
    </div>
    <h3 class="font-headline font-semibold text-2xl text-[#DAE3EE]">
        {{ title() }}
    </h3>
    <p class="font-body text-[#C2C6D6] text-base">
        {{ description() }}
    </p>
</article>
