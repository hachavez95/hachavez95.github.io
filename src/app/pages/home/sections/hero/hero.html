<section class="bg-[#0b141c] py-12 md:py-24 xl:py-36">
    <div class="flex flex-col px-4 gap-8 md:flex-row md:items-center md:px-8 md:justify-between xl:px-12 xl:max-w-384 xl:mx-auto">
        <div class="space-y-4 max-w-3xl md:flex-1">
            <div
                class="flex items-center px-4 py-2 gap-x-2 border bg-[rgba(173,198,255,0.1)] border-[rgba(173,198,255,0.2)] w-fit rounded-full">
                <div class="size-2 rounded-full bg-[#ADC6FF]"></div>
                <span class="text-[#ADC6FF] font-medium text-[14px]">Disponible para oportunidades</span>
            </div>

            <h1 class="font-bold text-[32px] text-[#DAE3EE] font-headline md:text-[48px]">
                Hola, soy Andy Chavez.
            </h1>

            <span class="inline-block">
                <app-typewriter class="text-[#4CD7F6] text-2xl font-headline font-semibold md:text-[32px]"
                                [texts]="['REST APIs', 'TypeScript', 'MySQL', 'Backend Development', 'Node.js']"/>
            </span>

            <p class="font-body text-[18px] text-[#C2C6D6] leading-7">Desarrollo aplicaciones web modernas con un fuerte
                enfoque en el desarrollo backend, la arquitectura limpia y las soluciones escalables, al tiempo que
                mejoro continuamente mis habilidades en frontend.
            </p>
            <div class="flex gap-x-4">
                <a class="text-[#002E6A] bg-[#adc6ff] flex-1 text-center py-4 rounded-xl font-medium text-[14px] tracking-wide max-w-39.25 hover:bg-[#bedaff] transition-colors ease-in-out duration-500">
                    Ver proyectos</a>
                <a class="flex-1 bg-[#0b141c] text-[#DAE3EE] py-4 text-center border border-[#424754] rounded-xl font-medium text-[14px] tracking-wide max-w-39.25 hover:bg-[#2d363e] transition-colors ease-in-out duration-500">Contactame</a>
            </div>
        </div>
        <div class="w-full h-full min-h-0 rounded-2xl border-2 border-[#424754] overflow-hidden md:flex-1 md:max-w-109.5">
            <img src="/images/random-person.jpeg" class="object-cover w-full h-full block" alt="">
        </div>
    </div>
</section>
